<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask & MongoDB Form</title>
    <link rel="stylesheet" href="static/style.css">
    
</head>
<body>
    <main class="card">
        <h1>Flask & MongoDB Atlas</h1>
        <p>Submit the form to store data in MongoDB Atlas.</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('index', _method='POST') }}">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" value="{{ name or '' }}" required>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" value="{{ email or '' }}" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required>{{ message or '' }}</textarea>

            <button type="submit">Submit</button>
        </form>

        <!-- <p class="api-link"><a href="success.html">Open JSON API Route</a></p> -->
        <p class="api-link"><a href="{{ url_for('api') }}">Open JSON API Route</a></p>
    </main>
</body>
</html>
